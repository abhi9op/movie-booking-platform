<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-movie booking and reviews</title>

    <style>
        body {
            margin: 0;  /*removes default space around the webpage*/
            font-family: Arial, sans-serif;   /*sets font style of the webpage*/
            background-color: #0F3D78;   /*it sets main webpage background to darkblue*/
            color: white;    /*it sets text colour to white*/
        }

        header {
            background-color: #08A9E6;   
            text-align: center;
            padding: 20px;   /*it sets 20px of space inside the header ,around its content*/
        }
        header h1 {margin:0}   /*removes default margin around the heading*/

        .login-container { /*its main purpose is to place the login box at the center of the webpage*/
            display: flex;  /* */
            justify-content: center; /* it places login box horizontally center */
            align-items: center;  /*vertically center*/
            min-height: 70vh; /* vh-viewport heught ,it sets 70 percent of the browser height*/
        }

        .login-box {
            background-color: #1E293B;
            width: 350px;
            padding: 35px;
            border-radius: 12px;  /*it makes corners of the box rounded*/ 
            text-align: center;
        }

        .login-box h2 {
            color: #38BDF8;
            margin-bottom: 25px;  /*it sets 25px of space below h2 to seperate it from email field*/
        }

        .login-box input {
            width: 90%;
            padding: 12px;
            margin: 10px;  /*gives 10 px of space between the input fields */  
            border-radius: 6px;  
            font-size: 16px;}

        .login-box button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            background-color: #08A9E6;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #38BDF8;  /*if we move cursor over the button it changes its colour */
        }

        .login-box a {
            color: #38BDF8;
            text-decoration: none; /*removes underline from the link */
        }
    </style>
</head>

<body>

    <header>
       <h1>🎬</h1>
    </header>

    <div class="login-container">

        <div class="login-box">

            <h2>Login</h2>

            <form>
                <input type="email" placeholder="Enter Email" required>

                <input type="password" placeholder="Enter Password" required>

                <button type="submit">Login</button>
            </form>

            <p>Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>

    </div>

</body>
</html>
