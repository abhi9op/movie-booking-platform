<!DOCTYPE html>
<html>
<head>
  <title>Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="payment.css">
  <style>
    .pay-now-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border: 1px solid #d9b8ff;
      border-radius: 10px;
      background: linear-gradient(135deg, #9b4dff, #6412a3);
      color: white;
      font-family: "Space Mono", monospace;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .pay-now-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(155, 77, 255, 0.45);
    }

    .pay-now-button:focus-visible {
      outline: 3px solid lightblue;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="payment-box">
    <h1>Complete Payment</h1>

    <p>Movie: <span id="movie">Not selected</span></p>
    <p>Seats: <span id="seats">No seats selected</span></p>
    <p>Subtotal: <span id="subtotal">₹0</span></p>

    <p>
      <label for="coupon-code">Coupon code:</label>
      <input id="coupon-code" type="text" autocomplete="off">
      <button type="button" onclick="applyCoupon()">Apply</button>
    </p>
    <p id="coupon-message"></p>
    <p>Discount: <span id="discount">₹0</span></p>
    <p>Total: <span id="total">₹0</span></p>

    <h2>Choose a payment method</h2>
    <p><label><input type="radio" name="method" value="UPI" checked> UPI</label></p>
    <p><label><input type="radio" name="method" value="Card"> Card</label></p>
    <p><label><input type="radio" name="method" value="Wallet"> Wallet</label></p>

    <button class="pay-now-button" onclick="completePayment()">Pay Now</button>
    <p id="message"></p>
    <a id="seats-link" href="seat.html">Go back to seats</a>
    <span> | </span>
    <a href="home.html">Home</a>
  </div>

  <script src="payment.js"></script>
</body>
</html>
